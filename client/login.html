<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - EventRush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">EventRush</a>
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="login.html" id="login-link" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h3>Login to Your Account</h3>
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="e.g. alex@example.com" required autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="cta-button submit-btn">Login</button>
                <p class="form-message"></p>
                <p class="switch-form-text">Don't have an account? <a href="#" id="show-register">Register here</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <h3>Create a New Account</h3>
                <div class="input-group">
                    <label for="register-username">Full Name / Username</label>
                    <input type="text" id="register-username" placeholder="e.g. Alex Johnson" required autocomplete="name">
                </div>
                <div class="input-group">
                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email" placeholder="e.g. alex@example.com" required autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" class="cta-button submit-btn">Create Account</button>
                <p class="form-message"></p>
                <p class="switch-form-text">Already have an account? <a href="#" id="show-login">Login here</a></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EventRush. All rights reserved.</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
